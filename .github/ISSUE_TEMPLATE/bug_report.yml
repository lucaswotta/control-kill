name: Bug report
description: Something did not die, or something died that should not have.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Affected app
      description: Name, and how it was installed (distro package, Flatpak, Snap, Wine/Bottles, AppImage...).
      placeholder: SQLyog under Bottles (Flatpak)
    validations:
      required: true
  - type: input
    id: gnome
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`.
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: Debian 13, Fedora 42, Ubuntu 24.04...
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      description: Output of `echo $XDG_SESSION_TYPE`.
      options: [wayland, x11]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `journalctl -b -o cat /usr/bin/gnome-shell | grep control-kill`
      render: text
