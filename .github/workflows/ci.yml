name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext libglib2.0-bin shellcheck zip

      - run: npm ci

      - name: Lint, schema, translations, installer
        run: make check

      - name: Translation template matches the code
        run: |
          xgettext --from-code=UTF-8 --language=JavaScript \
            --files-from=po/POTFILES --output=/tmp/fresh.pot
          ids() { msgcat --no-wrap --sort-output "$1" | grep '^msgid '; }
          diff <(ids /tmp/fresh.pot) <(ids po/control-kill.pot) || {
            echo "::error::po/control-kill.pot is stale. Run 'make pot' and commit."
            exit 1
          }

      - run: make zip

      - uses: actions/upload-artifact@v7
        with:
          name: control-kill-extension
          path: control-kill@lucaswotta.github.io.shell-extension.zip
