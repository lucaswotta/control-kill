name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext zip

      - name: Tag matches metadata.json
        run: |
          want="v$(jq -r '."version-name"' metadata.json)"
          [ "$want" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME but metadata.json says $want"
            exit 1
          }

      - run: make zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            /^\[[0-9.]+\]: / { next }
            on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            control-kill@lucaswotta.github.io.shell-extension.zip \
            --title "Control Kill $version" --notes-file notes.md
